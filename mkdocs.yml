site_name: "neuroflow"
site_description: "A complete research system for neuroscience teams, inside Claude Code: nineteen phases from the first question to the published paper, with memory, tasks and deadlines for you, the project and the team."
site_url: "https://stanislavjiricek.github.io/neuroflow/"
repo_url: "https://github.com/stanislavjiricek/neuroflow"
repo_name: "stanislavjiricek/neuroflow"
edit_uri: ""

hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  __pycache__/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-brain.svg
  favicon: assets/logo-brain.svg
  language: en
  features:
    - navigation.sections
    - navigation.path
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      tip: octicons/squirrel-16
      warning: octicons/alert-16
      info: octicons/info-16
      example: octicons/beaker-16

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols

extra:
  version: "0.2.23"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stanislavjiricek/neuroflow
      name: neuroflow on GitHub
  generator: false

extra_css:
  - stylesheets/nf.css

extra_javascript:
  - javascripts/nf.js

plugins:
  - search:
      lang: en
  - tags
  # Pages of renamed skills keep their old addresses (the protocol skills were renamed in 0.2.22).
  - redirects:
      redirect_maps:
        skills/autoresearch/SKILL.md: skills/autoresearch-protocol/SKILL.md
        skills/autoresearch/references/integrity.md: skills/autoresearch-protocol/references/integrity.md
        skills/autoresearch/references/phase-criteria.md: skills/autoresearch-protocol/references/phase-criteria.md
        skills/wiki/SKILL.md: skills/wiki-protocol/SKILL.md
        skills/setup/SKILL.md: skills/setup-guide/SKILL.md
        skills/setup/references/custom-gateway.md: skills/setup-guide/references/custom-gateway.md

